<svg width="1400" height="200" viewBox="0 0 1400 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradiente de fundo mais suave -->
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fef3c7;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#fed7aa;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#fdba74;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fb923c;stop-opacity:1" />
    </linearGradient>
    <pattern id="pizza-pattern" x="0" y="0" width="80" height="80" patternUnits="userSpaceOnUse">
      <circle cx="40" cy="40" r="2" fill="rgba(251,146,60,0.2)"/>
      <circle cx="20" cy="20" r="1.5" fill="rgba(251,146,60,0.15)"/>
      <circle cx="60" cy="60" r="1.5" fill="rgba(251,146,60,0.15)"/>
    </pattern>
    <radialGradient id="pizza-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:rgba(251,146,60,0.3);stop-opacity:1" />
      <stop offset="100%" style="stop-color:rgba(251,146,60,0);stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Fundo principal -->
  <rect width="1400" height="200" fill="url(#bg-gradient)"/>
  
  <!-- Padrão de textura sutil -->
  <rect width="1400" height="200" fill="url(#pizza-pattern)"/>
  
  <!-- Elementos decorativos sutis -->
  <!-- Pizza grande no canto esquerdo -->
  <circle cx="150" cy="100" r="80" fill="url(#pizza-glow)"/>
  <circle cx="150" cy="100" r="50" fill="rgba(251,146,60,0.2)" stroke="rgba(251,146,60,0.3)" stroke-width="2"/>
  <text x="150" y="110" text-anchor="middle" fill="rgba(251,146,60,0.6)" font-family="Arial, sans-serif" font-size="32">🍕</text>
  
  <!-- Pizza média no canto direito -->
  <circle cx="1250" cy="100" r="60" fill="url(#pizza-glow)"/>
  <circle cx="1250" cy="100" r="35" fill="rgba(251,146,60,0.2)" stroke="rgba(251,146,60,0.3)" stroke-width="2"/>
  <text x="1250" y="110" text-anchor="middle" fill="rgba(251,146,60,0.6)" font-family="Arial, sans-serif" font-size="24">🍕</text>
  
  <!-- Pizzas pequenas espalhadas -->
  <circle cx="300" cy="50" r="15" fill="rgba(251,146,60,0.15)"/>
  <text x="300" y="55" text-anchor="middle" fill="rgba(251,146,60,0.4)" font-family="Arial, sans-serif" font-size="12">🍕</text>
  
  <circle cx="1100" cy="160" r="15" fill="rgba(251,146,60,0.15)"/>
  <text x="1100" y="165" text-anchor="middle" fill="rgba(251,146,60,0.4)" font-family="Arial, sans-serif" font-size="12">🍕</text>
  
  <circle cx="500" cy="170" r="12" fill="rgba(251,146,60,0.15)"/>
  <text x="500" y="175" text-anchor="middle" fill="rgba(251,146,60,0.4)" font-family="Arial, sans-serif" font-size="10">🍕</text>
  
  <circle cx="900" cy="30" r="12" fill="rgba(251,146,60,0.15)"/>
  <text x="900" y="35" text-anchor="middle" fill="rgba(251,146,60,0.4)" font-family="Arial, sans-serif" font-size="10">🍕</text>
  
  <!-- Linha decorativa sutil no topo -->
  <rect x="0" y="0" width="1400" height="3" fill="rgba(251,146,60,0.4)"/>
  
  <!-- Linha decorativa sutil na base -->
  <rect x="0" y="197" width="1400" height="3" fill="rgba(251,146,60,0.4)"/>
</svg>