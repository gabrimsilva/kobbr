<svg viewBox="0 0 600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad-bg-pastor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1f3a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f1428;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="900" fill="url(#grad-bg-pastor)"/>
  
  <!-- Lighting effects -->
  <rect width="600" height="900" fill="url(#grad-bg-pastor)" opacity="0.3"/>
  
  <!-- Subtle pattern -->
  <circle cx="150" cy="200" r="100" fill="#00d4ff" opacity="0.05"/>
  <circle cx="500" cy="700" r="150" fill="#7c3aed" opacity="0.05"/>
  
  <!-- Center glow -->
  <ellipse cx="300" cy="450" rx="250" ry="300" fill="#0066ff" opacity="0.08"/>
  
  <!-- Text placeholder -->
  <text x="300" y="450" font-family="Arial, sans-serif" font-size="48" font-weight="bold" text-anchor="middle" fill="rgba(255,255,255,0.1)">Pastor</text>
</svg>
