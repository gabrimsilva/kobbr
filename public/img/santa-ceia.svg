<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad-bg-ceia" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1f3a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f1428;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="url(#grad-bg-ceia)"/>
  
  <!-- Warm lighting -->
  <ellipse cx="400" cy="300" rx="350" ry="280" fill="#ff6b35" opacity="0.08"/>
  
  <!-- Subtle elements -->
  <circle cx="200" cy="150" r="80" fill="#ff6b35" opacity="0.06"/>
  <circle cx="650" cy="450" r="100" fill="#00d4ff" opacity="0.04"/>
  
  <!-- Text placeholder -->
  <text x="400" y="300" font-family="Arial, sans-serif" font-size="48" font-weight="bold" text-anchor="middle" fill="rgba(255,255,255,0.1)">Santa Ceia</text>
</svg>
