<svg width="1550" height="200" viewBox="0 0 1550 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradiente de fundo rosa elegante -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fce7f3;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#fbcfe8;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#f9a8d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f472b6;stop-opacity:1" />
    </linearGradient>
    
    <!-- Gradiente para elementos decorativos -->
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ec4899;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#f472b6;stop-opacity:0.1" />
    </linearGradient>
    
    <!-- Padrão de círculos decorativos -->
    <pattern id="circles" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="2" fill="#f9a8d4" opacity="0.3"/>
      <circle cx="60" cy="60" r="3" fill="#fbcfe8" opacity="0.2"/>
      <circle cx="80" cy="30" r="1.5" fill="#ec4899" opacity="0.25"/>
    </pattern>
  </defs>
  
  <!-- Fundo principal -->
  <rect width="1550" height="200" fill="url(#bgGradient)"/>
  
  <!-- Padrão de círculos -->
  <rect width="1550" height="200" fill="url(#circles)"/>
  
  <!-- Círculos decorativos grandes (esquerda) -->
  <circle cx="80" cy="100" r="60" fill="#fce7f3" opacity="0.4"/>
  <circle cx="80" cy="100" r="40" fill="#fbcfe8" opacity="0.3"/>
  <circle cx="80" cy="100" r="20" fill="#f9a8d4" opacity="0.5"/>
  
  <!-- Círculos decorativos grandes (direita) -->
  <circle cx="1470" cy="100" r="60" fill="#fce7f3" opacity="0.4"/>
  <circle cx="1470" cy="100" r="40" fill="#fbcfe8" opacity="0.3"/>
  <circle cx="1470" cy="100" r="20" fill="#f9a8d4" opacity="0.5"/>
  
  <!-- Elementos decorativos - Batom estilizado (esquerda) -->
  <g transform="translate(200, 60)">
    <rect x="0" y="40" width="20" height="50" rx="2" fill="#ec4899" opacity="0.6"/>
    <ellipse cx="10" cy="40" rx="10" ry="15" fill="#f472b6" opacity="0.7"/>
    <rect x="5" y="35" width="10" height="5" fill="#be185d" opacity="0.5"/>
  </g>
  
  <!-- Elementos decorativos - Batom estilizado (direita) -->
  <g transform="translate(1330, 60)">
    <rect x="0" y="40" width="20" height="50" rx="2" fill="#ec4899" opacity="0.6"/>
    <ellipse cx="10" cy="40" rx="10" ry="15" fill="#f472b6" opacity="0.7"/>
    <rect x="5" y="35" width="10" height="5" fill="#be185d" opacity="0.5"/>
  </g>
  
  <!-- Elementos decorativos - Frasco de perfume (esquerda) -->
  <g transform="translate(300, 70)">
    <rect x="5" y="0" width="3" height="15" fill="#ec4899" opacity="0.5"/>
    <rect x="0" y="15" width="13" height="40" rx="3" fill="#f9a8d4" opacity="0.6"/>
    <rect x="2" y="20" width="9" height="25" rx="2" fill="#fbcfe8" opacity="0.4"/>
  </g>
  
  <!-- Elementos decorativos - Frasco de perfume (direita) -->
  <g transform="translate(1237, 70)">
    <rect x="5" y="0" width="3" height="15" fill="#ec4899" opacity="0.5"/>
    <rect x="0" y="15" width="13" height="40" rx="3" fill="#f9a8d4" opacity="0.6"/>
    <rect x="2" y="20" width="9" height="25" rx="2" fill="#fbcfe8" opacity="0.4"/>
  </g>
  
  <!-- Elementos decorativos - Pincel de maquiagem -->
  <g transform="translate(400, 80)">
    <line x1="5" y1="0" x2="5" y2="30" stroke="#ec4899" stroke-width="2" opacity="0.5"/>
    <ellipse cx="5" cy="35" rx="8" ry="12" fill="#f472b6" opacity="0.6"/>
  </g>
  
  <g transform="translate(1150, 80)">
    <line x1="5" y1="0" x2="5" y2="30" stroke="#ec4899" stroke-width="2" opacity="0.5"/>
    <ellipse cx="5" cy="35" rx="8" ry="12" fill="#f472b6" opacity="0.6"/>
  </g>
  
  <!-- Estrelinhas decorativas -->
  <g opacity="0.4">
    <circle cx="500" cy="50" r="2" fill="#ec4899"/>
    <circle cx="520" cy="150" r="1.5" fill="#f472b6"/>
    <circle cx="1050" cy="50" r="2" fill="#ec4899"/>
    <circle cx="1030" cy="150" r="1.5" fill="#f472b6"/>
    <circle cx="750" cy="30" r="1" fill="#fbcfe8"/>
    <circle cx="800" cy="170" r="1" fill="#fbcfe8"/>
  </g>
  
  <!-- Ondas decorativas suaves -->
  <path d="M 0 150 Q 200 130, 400 150 T 800 150 T 1200 150 T 1550 150 L 1550 200 L 0 200 Z" 
        fill="url(#accentGradient)" opacity="0.3"/>
  
  <path d="M 0 170 Q 250 160, 500 170 T 1000 170 T 1550 170 L 1550 200 L 0 200 Z" 
        fill="url(#accentGradient)" opacity="0.2"/>
</svg>
